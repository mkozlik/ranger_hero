name: ranger_startup
root: ./
startup_window: launch
pre_window: |
  # humble
  export AGV_NAMESPACE=ranger
windows:
  - scout_launch:
    - bash /root/ranger_ws/src/ranger_ros2/ranger_bringup/scripts/bringup_can2usb.bash; ros2 launch ranger_bringup ranger_mini_v2.launch.py robot_model:=ranger_mini_v3 publish_odom_tf:=true base_frame:=ranger_base_link odom_frame:=odom
  - tf_publisher:
      layout: tiled
      panes:
        - history -s  "ros2 run tf2_ros static_transform_publisher 0.1679 0 0.023 0 0 0 ranger_base_link world"
        - history -s  "ros2 run tf2_ros static_transform_publisher 0.288151 -0.006977 0.046311 1.570796 0 0 ranger_base_link livox_frame"
        - history -s  "ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 ranger_base_link base_footprint"
        - history -s  "ros2 run tf2_ros static_transform_publisher 0.07 0 0 0 -1.570796 0 dummy_link camera_link"
  - teleop:
    - ros2 run teleop_twist_keyboard teleop_twist_keyboard
  - kinova:
      layout: tiled
      panes:
        - ros2 launch kinova_gen3_lite_moveit_config robot.launch.py robot_ip:=192.168.3.10
        - sleep 3; ros2 run move_kinova_package move_kinova_node
        - sleep 3; ros2 run move_kinova_package move_kinova_service
        - history -s "ros2 service call /trigger_grab std_srvs/srv/Trigger {}"
  - livox:
      layout: tiled
      panes:
        - ldconfig; ros2 launch livox_ros_driver2 rviz_MID360_launch.py user_config_path:=$(pwd)/config/livox_config.json
        - history -s "ros2 run pointcloud_to_laserscan pointcloud_to_laserscan_node --ros-args -r cloud_in:=/livox/lidar -p min_height:=1.4 -p max_height:=1.5 -p range_min:=1.0 -p range_max:=20.0 -p target_frame:=livox_frame" # -p min_height:=1.1 -p max_height:=1.3 # for walls
        - history -s "ros2 run pointcloud_to_laserscan pointcloud_to_laserscan_node --ros-args -r cloud_in:=/livox/lidar -p min_height:=-0.2 -p max_height:=0.3 -p range_min:=0.7 -p range_max:=20.0 -p target_frame:=livox_frame -r scan:=/scan_obstacles"
  - bag:
      - cd /root/bags/iros26; history -s "ros2 bag record --all"
  - manual_control:
      layout: tiled
      panes:
        - |
          history -s "ros2 topic pub /joint_trajectory_controller/joint_trajectory trajectory_msgs/JointTrajectory \"{ joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6], points: [ { positions: [0, 0, 0, 0, 0, 0], time_from_start: { sec: 5 } }, ] }\" -1"
  - slam:
      layout: tiled
      panes:
        - history -s "ros2 launch slam_toolbox online_async_launch.py slam_params_file:=$(pwd)/config/mapper_params_online_async.yaml"
  - mqtt:
      layout: tiled
      panes:
        - ros2 run mqtt_client mqtt_client --ros-args --params-file $(pwd)/config/mqtt_jazzy_config.yaml
        - ros2 run ros_tcp_endpoint default_server_endpoint
        - python3 $(pwd)/scripts/republish_tf.py